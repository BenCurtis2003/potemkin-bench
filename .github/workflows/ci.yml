name: tests

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "verifiers==0.4.0" pytest
          pip install -e environments/potemkin_bench
      # template contract (tests/test_contract.py) + per-family and reward tests; no model calls
      - name: Test
        run: pytest -q tests
